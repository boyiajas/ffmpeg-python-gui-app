<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E95420" />
      <stop offset="100%" stop-color="#77216F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#gradBg)" filter="url(#shadow)"/>
  
  <!-- Video Clapper / Film Strip icon on Left -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Film frame -->
    <rect x="44" y="64" width="76" height="96" rx="10" fill="#FFFFFF" opacity="0.2" stroke="#FFFFFF" stroke-width="4"/>
    <polygon points="72,92 72,132 102,112" fill="#FFFFFF"/>
    <circle cx="54" cy="74" r="4" fill="#FFFFFF"/>
    <circle cx="54" cy="96" r="4" fill="#FFFFFF"/>
    <circle cx="54" cy="118" r="4" fill="#FFFFFF"/>
    <circle cx="54" cy="140" r="4" fill="#FFFFFF"/>
  </g>
  
  <!-- Plus / Merge Convergence Symbol -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="128" y1="100" x2="128" y2="124" />
    <line x1="116" y1="112" x2="140" y2="112" />
  </g>
  
  <!-- Audio Waveform / Music Note on Right -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Equalizer / Wave Bars -->
    <rect x="148" y="104" width="6" height="24" rx="3"/>
    <rect x="160" y="88" width="6" height="56" rx="3"/>
    <rect x="172" y="72" width="6" height="88" rx="3"/>
    <rect x="184" y="92" width="6" height="48" rx="3"/>
    <rect x="196" y="108" width="6" height="16" rx="3"/>
  </g>
  
  <!-- Bottom Merged Stream Banner -->
  <rect x="44" y="174" width="168" height="28" rx="14" fill="#FFFFFF" opacity="0.25"/>
  <text x="128" y="193" font-family="Ubuntu, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">FFMPEG MERGER</text>
</svg>